name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        # Note: This requires VERCEL_TOKEN and VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets
        run: |
          echo "Ready for deployment. Please configure your Vercel secrets in GitHub."
